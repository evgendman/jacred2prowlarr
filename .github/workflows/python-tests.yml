name: Python tests

on:
  push:
    branches: [main, v2.3.0-local-jacred-protection]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile adapter
        run: python -m py_compile jacred_v2_adapter.py
      - name: Run mock-upstream tests
        run: python -m unittest discover -s tests -v
